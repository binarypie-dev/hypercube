# Hypridle Configuration - Auto-lock for the niri session
# Same timeouts as the Hyprland one (dot_files/hypr/hypridle.conf); only the
# DPMS commands differ (niri msg instead of hyprctl).
# Tokyo Night Theme

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = niri msg action power-on-monitors  # to avoid having to press a key twice to turn on the display
}

# Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150                                # 2.5 minutes
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor
    on-resume = brightnessctl -r                 # restore monitor backlight
}

# Turn off keyboard backlight after 2.5 minutes
listener {
    timeout = 150                                # 2.5 minutes
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0  # turn off keyboard backlight
    on-resume = brightnessctl -rd rgb:kbd_backlight         # turn on keyboard backlight
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300                                # 5 minutes
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

# Turn off screen after 5.5 minutes of inactivity (30 seconds after lock)
listener {
    timeout = 330                                # 5.5 minutes
    on-timeout = niri msg action power-off-monitors  # screen off when timeout has passed
    on-resume = niri msg action power-on-monitors    # screen on when activity is detected after timeout has fired
}

# Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800                               # 30 minutes
    on-timeout = systemctl suspend               # suspend pc
}

