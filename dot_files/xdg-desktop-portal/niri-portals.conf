# Hypercube portal routing for the niri session.
# Found through XDG_CONFIG_DIRS (/usr/share/hypercube/config), so it takes
# precedence over the niri-portals.conf shipped by the niri package.
#
# Same as upstream niri except FileChooser: xdg-desktop-portal-gnome 47+ needs
# Nautilus for file pickers, which Hypercube doesn't ship, so use the GTK
# portal (as the Hyprland session does).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
