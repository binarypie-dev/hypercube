# SSH agent socket from GNOME Keyring (started and unlocked by PAM at login,
# and by both the Hyprland and niri sessions). Hyprland also sets this in hyprland.lua; niri's config can't
# expand $XDG_RUNTIME_DIR, so set it for the whole user session here.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/keyring/ssh
