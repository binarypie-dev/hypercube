# Hypercube XDG Configuration
#
# This configuration adds Hypercube system configs to the XDG search paths.
#
# Config lookup order (highest to lowest priority):
#   1. ~/.config/          - User overrides
#   2. /etc/xdg/           - Admin overrides
#   3. /usr/share/hypercube/config/ - Hypercube defaults (always current)
#
# Data lookup order:
#   1. ~/.local/share/     - User data
#   2. /usr/local/share/   - Local admin data (writable: /usr/local -> /var/usrlocal)
#   3. /usr/share/hypercube/data/ - Hypercube data (e.g. .desktop overrides that
#      launch TUIs in ghostty-kiosk; must win over the packages' own entries)
#   4. /usr/share/         - System data
#
# Never ship files under /usr/local in the image: on bootc it is a symlink to
# /var/usrlocal, and the build's rsync would replace it with a read-only directory.

XDG_CONFIG_DIRS=/etc/xdg:/usr/share/hypercube/config
XDG_DATA_DIRS=/usr/local/share:/usr/share/hypercube/data:/usr/share

# Default web browser. Honored by CLI tools and by xdg-open's generic fallback
# (used on Hyprland, which xdg-open treats as a generic desktop).
BROWSER=firefox

# GTK theme settings for Wayland
GTK_THEME=Tokyonight-Dark

# Qt theming - use qt6ct for Tokyo Night colors
QT_QPA_PLATFORMTHEME=qt6ct
